name: Integration tests

on:
  push:
    branches: [features, main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and app lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: make check PYTHON=python
      - run: make test-unit PYTHON=python

  e2e:
    name: Docker end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Test dependencies are installed inside tests/Dockerfile, not on the host.
      - run: make test-e2e PYTHON=python
      - name: Upload test results and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: artifacts/
          if-no-files-found: warn
