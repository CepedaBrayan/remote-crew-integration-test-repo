name: Webhook tests

on:
  push:
    branches: [features, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaseflow
          POSTGRES_PASSWORD: leaseflow
          POSTGRES_DB: leaseflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseflow -d leaseflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://leaseflow:leaseflow@localhost:5432/leaseflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
